name: Bootstrap curated public source

on:
  push:
    paths:
      - ".bootstrap/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Expand curated source archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE=".bootstrap/jimeng-ai-academy-skill-public-v1.0.0.zip"
          if [ ! -f "$ARCHIVE" ]; then
            echo "Bootstrap archive already removed; nothing to do."
            exit 0
          fi
          rm -rf /tmp/jimeng-public-export
          mkdir -p /tmp/jimeng-public-export
          unzip -q "$ARCHIVE" -d /tmp/jimeng-public-export
          test -d /tmp/jimeng-public-export/jimeng-ai-academy-skill-public
          rsync -a /tmp/jimeng-public-export/jimeng-ai-academy-skill-public/ ./
          rm -rf .bootstrap

      - name: Verify public smoke suite
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/run_public_smoke.py ]; then
            python scripts/run_public_smoke.py
          fi

      - name: Commit imported source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "chore: import curated public source v1.0.0"
          git push
