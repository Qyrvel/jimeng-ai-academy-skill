name: Bug report
description: Report a reproducible problem in validators, course wiring, assessments, or Skill behavior.
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the command, fixture, lesson/assessment ID, and minimal steps.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope / version context
      description: Product/model/client/version/region/account context if relevant.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Source IDs, URLs, or validator output supporting the report.
